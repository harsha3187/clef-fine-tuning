[project]
name = "system-one-models-experiment"
version = "0.1.0"
description = "Staged coding-agent routing experiments, with Azure-hosted model probes"
requires-python = ">=3.11"
dependencies = [
    "ipykernel>=7.3.0",
    "ipywidgets>=8.1.9",
    "matplotlib>=3.11.2",
    "nbclient>=0.11.0",
    "nbformat>=5.11.1",
    "pydantic>=2.13.5",
    "pytest>=9.1.1",
    "ruff>=0.16.8",
    "scikit-learn>=1.9.1",
    "tqdm>=4.70.1",
]

[project.optional-dependencies]
llm = [
    "azure-identity>=1.25.3",
    "openai>=3.19.0",
]
endpoint = [
    "azure-identity>=1.25.3",
    "requests>=2.34.2",
]
deployment = [
    "azure-ai-ml>=1.35.1",
    "azure-identity>=1.25.3",
]
benchmarks = [
    "pyarrow>=18",
    "requests>=2.34.2",
]

[[tool.uv.index]]
url = "https://packagefeedproxy.microsoft.io/pypi/simple/"
default = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
target-version = "py311"
line-length = 110

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
